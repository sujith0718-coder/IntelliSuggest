version: '3.8'

services:
  intellisuggest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intellisuggest-app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    volumes:
      - intellisuggest-data:/app/data
    restart: unless-stopped

volumes:
  intellisuggest-data:
    driver: local

