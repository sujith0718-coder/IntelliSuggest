version: '3.8'

services:
  intellisuggest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intellisuggest-app
    ports:
      - "10000:10000"
    environment:
      - PORT=10000
      - DATABASE_PATH=/var/data/intellisuggest.db
      - CORS_ORIGIN=*
    volumes:
      - intellisuggest-data:/var/data
    restart: unless-stopped

volumes:
  intellisuggest-data:
    driver: local
